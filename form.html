<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Assignment</title>
    <link rel="stylesheet" href="Assets/css/form.css">
</head>
<body>
    <form action="" method="post">
        <fieldset>
            <legend>Personal Details</legend>
            <label for="First Name">First Name</label>
            <input type="text" name="First Name" id="First Name" placeholder="First Name">
            <label for="Last Name">Last Name</label>
            <input type="text" name="Last Name" id="Last Name" placeholder="Last Name">
            <label for="Full Name">Full Name</label>
            <input type="text" name="Full Name" id="Full Name" placeholder="Full Name">
            <label for="Age">Age</label>
            <input type="number" name="Age" id="Age">
            <label for="Gender">Gender</label>
            <input type="radio" name="Male" id="Gender">Male
            <input type="radio" name="Female" id="Gender">Female
            <label for="mobileno">Phone Number</label>
            <input type="number" name="mobileno" id="mobileno">
            <label for="DOB">Date of Birth</label>
            <input type="date" name="DOB" id="DOB">
            <label for="Email">Email</label>
            <input type="email" name="Email" id="Email" placeholder="Email">
        </fieldset>
        <fieldset>
            <legend>Address</legend>
            <label for="Address">Permanent Address</label>
            <textarea name="Address" id="Address"></textarea><br>
            
            <label for="State">State</label>
            <select name="" id="" >
                <option value="">Maharashtra</option>
                <option value="">Gujarat</option>
                <option value="">Delhi</option>
                <option value="">Punjab</option>
                <option value="">Rajasthan</option>
                <option value="">Madhya Pradesh</option>
            </select>
            <label for="Pincode">Pincode</label>
            <input type="number" name="Pincode" id="Pincode">
        </fieldset>
        <input type="checkbox" name="" id=""> Same as Above


        <fieldset>
            <label for="Address1">Current Address</label>
            <textarea name="Address" id="Address1"></textarea>
        </fieldset>

        <input type="Submit" value="Submit">
    </form>
</body>
</html>
