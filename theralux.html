    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: #f7f3e8;
            color: #333;
            display: flex;
            flex-direction: column;
        }
        .header{
            padding: 20px 0;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 30px 50px;
            width: 100%;
            box-sizing: border-box;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }
        section{
            padding: 60px 0;
            padding-top: 100px;
            
            overflow: clip;
        }
        .logo-placeholder{
            visibility: hidden;
        }
        .logo{
            font-size: 28px;
            letter-spacing: 5px;
            color: #333;
            justify-self: center;
        }
        .contact-button{
            background-color: #c00000;
            color: white;
            border-style: none;
            padding: 10px 25px;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 2px;
            justify-self: end;
        }
        
        div{
            display: block;
        }
        img{
            vertical-align: middle;
        }
        .Star{
            display: grid;
            grid-template-columns: repeat(12,1fr);
            img{
                vertical-align: center;
            }
        }
        .text{
            grid-column: 6/12;
            justify-self: center;
            align-self: center;
            text-transform: uppercase;
            font-size: 48px;
            color: brown;
            padding: 5px 0;
            font-family: "area-normal", sans-serif;
            font-weight: 100;
            font-style: normal;
            word-spacing: 3px;
        }
        .text1{
            grid-column: 2/8;
            justify-self: center;

        .text2{

            color: brown;
            padding: 5px 0;
            font-family: "area-normal", sans-serif;
            font-weight: 100;
            font-style: normal;
            word-spacing: 3px;  
        }
        .slow-spin img{
            animation: slowspin 2s ease-in-out infinite;
        }
        .fast-spin img{
            animation: fastspin 2s ease-in-out infinite;
        }
        @keyframes slowspin{
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(90deg);
            }
        }
        @keyframes fastspin{
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
